<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok VPS Bot</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181e;
      --ink: #e8edf4;
      --muted: #8b98a8;
      --accent: #f2c14e;
      --line: #242b34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2230 0%, var(--bg) 55%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header strong { letter-spacing: 0.04em; }
    header span { color: var(--muted); font-size: 13px; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 720px;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #2a3340; }
    .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
    form {
      display: flex;
      gap: 8px;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--line);
    }
    input, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    input {
      flex: 1;
      padding: 12px 14px;
      background: var(--panel);
      color: var(--ink);
    }
    button {
      background: var(--accent);
      color: #111;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <strong>GROK · VPS</strong>
    <span id="status">locked</span>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask Grok…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const status = document.getElementById("status");
    const key = prompt("Web access key from your .env (WEB_ACCESS_KEY)") || "";
    status.textContent = key ? "ready" : "no key";

    function add(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("q");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", text);
      status.textContent = "thinking…";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Key": key },
          body: JSON.stringify({ message: text, session: "web" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        add("bot", data.reply);
        status.textContent = "ready";
      } catch (err) {
        add("bot", "Error: " + err.message);
        status.textContent = "error";
      }
    });
  </script>
</body>
</html>
